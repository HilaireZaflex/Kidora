name: kidora-macos
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: kidora
      POSTGRES_USER: kidora
      POSTGRES_PASSWORD: kidora_demo_local
    volumes:
      - macos-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kidora -d kidora"]
      interval: 3s
      timeout: 3s
      retries: 30
  api:
    image: kidora-macos-api
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    working_dir: /app
    command: ["bash", "/usr/local/bin/kidora-macos-api"]
    volumes:
      - ./apps/api:/app
      - macos-vendor:/app/vendor
      - ./macos/api-start.sh:/usr/local/bin/kidora-macos-api:ro
    environment:
      APP_ENV: local
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: kidora
      DB_USERNAME: kidora
      DB_PASSWORD: kidora_demo_local
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/api/v1/health') === false ? 1 : 0);"]
      interval: 5s
      timeout: 5s
      start_period: 120s
      retries: 60
  web:
    image: kidora-macos-web
    build:
      context: .
      dockerfile: infra/web.Dockerfile
    environment:
      API_URL: http://api:8000/api/v1
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:${KIDORA_WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 10s
      retries: 30
volumes:
  macos-db:
  macos-vendor:
